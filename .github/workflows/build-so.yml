name: Build IjkPlayer FFmpeg SO From Scratch

on:
  push:
    branches:
      - master33
#      - new-branch-name
  workflow_dispatch:

jobs:
  build-scratch:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 克隆官方 IjkPlayer 源码工程
      run: |
        git clone https://github.com/bilibili/ijkplayer.git ijkplayer-src
        cd ijkplayer-src
        git checkout master

    - name: 2. 安装编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y yasm make wget unzip git patch

    - name: 3. 下载并设置 Android NDK (r14b)
      run: |
        cd /tmp
        wget -q https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip
        unzip -q android-ndk-r14b-linux-x86_64.zip
        # 同时覆盖 ANDROID_NDK 和 ANDROID_NDK_ROOT，防止被 GitHub  runner 自带的 NDK 干扰
        echo "ANDROID_NDK=/tmp/android-ndk-r14b" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=/tmp/android-ndk-r14b" >> $GITHUB_ENV

    - name: 4. 初始化 FFmpeg 源码模块
      run: |
        cd ijkplayer-src
        ./init-android.sh

    - name: 5. 开启 avfilter 与 dynaudnorm 音量均衡滤镜
      run: |
        cd ijkplayer-src
        # 1. 暴力清除默认的 --disable-filters 限制
        find . -name "module.sh" -exec sed -i 's/--disable-filters//g' {} +
        
        # 2. 注入 avfilter 和 dynaudnorm 滤镜
        echo 'export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-avfilter --enable-filter=dynaudnorm"' >> config/module.sh
        if [ -f "android/contrib/config/module.sh" ]; then
          #echo 'export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-avfilter --enable-filter=dynaudnorm"' >> android/contrib/config/module.sh
          echo 'export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-avfilter --enable-filter=dynaudnorm --enable-filter=loudnorm"' >> config/module.sh
        fi

    - name: 6. 编译 armv7a 架构的 FFmpeg 和 IjkPlayer so 库
      run: |
        export PATH=$ANDROID_NDK:$PATH
        cd ijkplayer-src/android/contrib
        ./compile-ffmpeg.sh clean
        ./compile-ffmpeg.sh armv7a
        cd ..
        ./compile-ijk.sh armv7a

    - name: 7. 上传编译好的全套 so 库产物
      uses: actions/upload-artifact@v4
      with:
        name: ijkplayer-all-so-armeabi-v7a
        path: |
          ijkplayer-src/android/ijkplayer/ijkplayer-armv7a/src/main/libs/armeabi-v7a/*.so

