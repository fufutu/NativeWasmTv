name: Decompile APK to Smali

on:
  workflow_dispatch: # 允许你手动点按钮触发

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download Apktool
      run: |
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
        chmod +x apktool.jar

    - name: Decompile APK
      run: |
        # 解包 APK
        java -jar apktool.jar d nTv.apk -o decompiled_apk
        
    - name: Upload Smali Files
      uses: actions/upload-artifact@v4
      with:
        name: decompiled-smali
        # 打包反编译出来的 smali 目录
        path: decompiled_apk/smali*/
