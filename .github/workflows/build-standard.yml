name: Build nTv ARM32 (standard, no browser-core)

on:
  push:
    branches:
      - 1.8.2-standard  # 如果你换了分支，记得改成你当前的开发分支名
  workflow_dispatch:

jobs:
  build-arm32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 1. 还原签名文件
        run: |
          # 从 GitHub Secrets 中读取 Base64 并解码为 jks 文件
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > fufutu-release.jks
          ls -la fufutu-release.jks

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Make gradlew executable
        run: chmod +x gradlew

      - name: 3b. 安装 NDK 与 CMake（频道搜索的 SQLite 驱动要用）
        run: |
          set -e
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "NDK 已存在，跳过安装"
            exit 0
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "NDK 安装完成：$ANDROID_HOME/ndk/26.1.10909125"

      - name: 3c. 编译频道搜索的 libsqlitejni.so（armeabi-v7a）
        # 不经过 AGP 的 externalNativeBuild（AGP 8.9 的 CmakeOptions 不暴露 arguments，
        # 而 arm32 的 minSdk 14 必须显式抬到 android-21）。编译逻辑在脚本里，
        # 本机和 CI 共用同一份，产物直接落到 jniLibs 被正常打包。
        run: |
          set -e
          SCRIPT=app/src/main/cpp/build-search-native.sh
          chmod +x "$SCRIPT"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125" "$SCRIPT"
          SO=app/src/main/libs/armeabi-v7a/libsqlitejni.so
          file "$SO"
          # 必须是 32 位 ARM 的 ELF，否则装到电视上必然加载失败
          file "$SO" | grep -q "ELF 32-bit.*ARM" || { echo "libsqlitejni.so 架构不对"; exit 1; }
          # JNI 符号必须绑到 xiao.bu.tv.SQLiteEngine，符号对不上会 UnsatisfiedLinkError
          READELF="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          if [ -x "$READELF" ]; then
            "$READELF" --dyn-syms "$SO" | grep -q "xiao_bu_tv_SQLiteEngine_nativeOpen" \
              || { echo "libsqlitejni.so 的 JNI 符号不对"; exit 1; }
            echo "JNI 符号校验通过"
          else
            echo "未找到 llvm-readelf，跳过 JNI 符号校验"
          fi
          echo "libsqlitejni.so 校验通过"

      - name: 4. Build ARM32 Release APK
        # 注意这里改成了 assembleArm32Release
        # 依赖下载时 Maven Central 会偶发 429，这里对网络/限流类失败自动重试
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/gradle.log"
          : > "$LOG"
          for attempt in 1 2 3; do
            echo "===== Gradle 第 $attempt 次尝试 =====" | tee -a "$LOG"
            if ./gradlew :app:assembleArm32Release --stacktrace 2>&1 | tee -a "$LOG"; then
              exit 0
            fi
            if ! grep -Eq "status code 429|Could not GET|Read timed out|Connection reset|Could not resolve" "$LOG"; then
              echo "不是网络/限流类失败，直接退出" | tee -a "$LOG"
              exit 1
            fi
            echo "命中网络限流，$((attempt * 30)) 秒后重试" | tee -a "$LOG"
            sleep $((attempt * 30))
          done
          echo "三次尝试均失败" | tee -a "$LOG"
          exit 1

      - name: 4b. 构建失败时把关键报错打成注解
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          if [ ! -f "$LOG" ]; then echo "没有拿到 gradle 日志"; exit 0; fi
          python3 - "$LOG" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          lines = open(path, encoding="utf-8", errors="replace").read().splitlines()

          def emit(text):
              text = text.replace("%", "%25").replace("\r", "").strip()
              if text:
                  print("::error::" + text[:300])

          marks = [i for i, l in enumerate(lines) if "What went wrong" in l]
          if marks:
              emit("---- What went wrong ----")
              shown = 0
              for l in lines[marks[0] + 1: marks[0] + 60]:
                  # 只保留人类可读的结论，跳过 Gradle 内部栈帧
                  if l.strip().startswith(("at ", "...", "org.gradle.", "java.base")):
                      continue
                  emit(l)
                  shown += 1
                  if shown >= 25:
                      break
          else:
              emit("日志里没有 What went wrong 段")

          # 网络限流、依赖解析、编译的具体报错单独再抓一遍
          emit("---- 关键报错 ----")
          pat = re.compile(
              r"status code \d+|Could not (GET|resolve|download|find)"
              r"|error:|错误:|Missing class|Execution failed|FAILURE:"
          )
          hits = [l for l in lines if pat.search(l)]
          for l in hits[:25]:
              emit(l)
          PY

      - name: 5. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fufutu-tv-arm32-release
          # 注意这里的路径改成了 release 目录
          path: app/build/outputs/apk/arm32/release/*.apk
          if-no-files-found: error
