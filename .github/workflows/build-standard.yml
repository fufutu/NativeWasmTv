name: Build nTv ARM32 (standard, no browser-core)

on:
  push:
    branches:
      - 1.8.2-standard
  workflow_dispatch:

jobs:
  build-arm32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build ARM32 debug APK
        run: ./gradlew :app:assembleArm32Debug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nTv-arm32-debug
          path: app/build/outputs/apk/arm32/debug/*.apk
          if-no-files-found: error
