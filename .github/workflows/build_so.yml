name: Build IjkPlayer FFmpeg SO From Scratch

on:
  push:
    branches:
      - new-branch-name
  workflow_dispatch: # 支持在 GitHub 网页手动点按钮触发

jobs:
  build-scratch:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 克隆官方 IjkPlayer 源码工程
      run: |
        git clone https://github.com/bilibili/ijkplayer.git ijkplayer-src
        cd ijkplayer-src
        git checkout master

    - name: 2. 安装编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y yasm make wget unzip git patch

    - name: 3. 下载并设置 Android NDK (r15c)
      run: |
        cd /tmp
        wget -q https://dl.google.com/android/repository/android-ndk-r15c-linux-x86_64.zip
        unzip -q android-ndk-r15c-linux-x86_64.zip
        # 关键：伪装 NDK 版本为 r14b，骗过旧版 ijkplayer 的版本白名单校验
        echo "r14b" > /tmp/android-ndk-r15c/RELEASE.txt
        echo "ANDROID_NDK=/tmp/android-ndk-r15c" >> $GITHUB_ENV

    - name: 4. 初始化 FFmpeg 源码模块
      run: |
        cd ijkplayer-src
        ./init-android.sh

    - name: 5. 开启 avfilter 与 dynaudnorm 音量均衡滤镜
      run: |
        cd ijkplayer-src
        # 开启底层宏定义
        find . -name "config.h" -exec sed -i 's/#define CONFIG_AVFILTER 0/#define CONFIG_AVFILTER 1/g' {} +
        # 追加动态音量均衡滤镜
        if [ -f "config/module.sh" ]; then
          sed -i 's/COMMON_FF_CFG_FLAGS="/COMMON_FF_CFG_FLAGS="--enable-avfilter --enable-filter=dynaudnorm /g' config/module.sh
        fi

    - name: 6. 编译 armv7a 架构的 FFmpeg 和 IjkPlayer so 库
      run: |
        export PATH=$ANDROID_NDK:$PATH
        cd ijkplayer-src/android/contrib
        ./compile-ffmpeg.sh clean
        ./compile-ffmpeg.sh armv7a
        cd ..
        ./compile-ijk.sh armv7a

    - name: 7. 上传编译好的 libijkffmpeg.so 产物
      uses: actions/upload-artifact@v4
      with:
        name: libijkffmpeg-armeabi-v7a-scratch
        path: |
          ijkplayer-src/android/ijkplayer/ijkplayer-armv7a/src/main/libs/armeabi-v7a/libijkffmpeg.so

