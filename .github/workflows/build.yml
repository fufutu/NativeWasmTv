name: Build Android APK

on:
  push:
    branches:
      - optimize-prefetch333
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许你在GitHub页面上手动点击触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出代码 (Checkout)
      uses: actions/checkout@v4

    - name: 2. 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. 赋予 gradlew 执行权限
      run: chmod +x gradlew

    - name: 4. 使用 Gradle 编译 Debug 版 APK
      run: ./gradlew assembleDebug

    - name: 5. 上传编译好的 APK 产物
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/*.apk'

