
name: Build Android APK

on:
  push:
    branches:
      - build-stable

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. 赋予 gradlew 执行权限
      run: chmod +x gradlew

    - name: 4. 编译 Debug 版 APK (仅 Arm64)
      run: ./gradlew :app:assembleArm64Debug --console=plain

    - name: 5. 上传编译好的 APK
      uses: actions/upload-artifact@v4
      with:
        name: app-arm64-debug-apk
        path: '**/*.apk'

