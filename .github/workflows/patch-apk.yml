name: Explore D2 Smali

on:
  push:
    branches:
      - optimize-prefetch

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. 下载 Apktool
      run: |
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

    - name: 4. 反编译 APK
      run: |
        java -jar apktool.jar d nTv.apk -o decompiled_apk

    - name: 5. 提取 D2.smali 关键代码
      run: |
        echo "=== 寻找预取失败的异常处理 (修改点2) ==="
        # 在 D2.smali 中搜索 "HLS segment prefetch failed"，打印前后各 50 行
        grep -n -B 30 -A 30 "HLS segment prefetch failed" decompiled_apk/smali/xiao/bu/tv/D2.smali || echo "未找到异常处理代码"
        
        echo -e "\n\n=== 寻找预取循环 (修改点1) ==="
        # 搜索包含 "HLS startup prefetch failed" 的地方
        grep -n -B 50 -A 50 "HLS startup prefetch failed" decompiled_apk/smali/xiao/bu/tv/D2.smali || echo "未找到启动预取代码"

        echo -e "\n\n=== 寻找常量 2 ==="
        # 搜索 const/4 ... , 0x2
        grep -n "const/4 v[0-9]*, 0x2" decompiled_apk/smali/xiao/bu/tv/D2.smali | head -n 20
