name: Explore Add and FutureTask

on:
  push:
    branches:
      - optimize-prefetch

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. 下载 Apktool
      run: |
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

    - name: 4. 反编译 APK
      run: |
        java -jar apktool.jar d nTv.apk -o decompiled_apk

    - name: 5. 探索 List->add 与 FutureTask 上下文
      run: |
        python3 << 'EOF'
        import re

        file_path = "decompiled_apk/smali/xiao/bu/tv/D2.smali"
        with open(file_path, "r", encoding="utf-8") as f:
            content = f.read()

        lines = content.split('\n')

        print("=== 1. 寻找 Ljava/util/List;->add 附近的方法 ===")
        for i, line in enumerate(lines):
            if "Ljava/util/List;->add(Ljava/lang/Object;)Z" in line:
                # 向上找方法定义
                method_start = i
                while method_start > 0 and not lines[method_start].startswith(".method"):
                    method_start -= 1
                
                # 打印方法名以及前后30行
                print(f"\n[发现 List->add] 位置: 第 {i} 行, 所属方法: {lines[method_start].strip()}")
                print("--- 上下文 开始 ---")
                for j in range(max(0, i-30), min(len(lines), i+20)):
                    print(lines[j])
                print("--- 上下文 结束 ---\n")

        print("\n=== 2. 寻找 Ljava/util/concurrent/FutureTask; 附近的方法 ===")
        for i, line in enumerate(lines):
            if "Ljava/util/concurrent/FutureTask;" in line:
                method_start = i
                while method_start > 0 and not lines[method_start].startswith(".method"):
                    method_start -= 1
                
                print(f"\n[发现 FutureTask] 位置: 第 {i} 行, 所属方法: {lines[method_start].strip()}")
                print("--- 上下文 开始 ---")
                for j in range(max(0, i-30), min(len(lines), i+20)):
                    print(lines[j])
                print("--- 上下文 结束 ---\n")
                break # 找到一个就行了，通常都在同一个方法里
        EOF
