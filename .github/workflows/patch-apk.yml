name: Explore APK Structure

on:
  push:
    branches:
      - optimize-prefetch

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. 下载 Apktool
      run: |
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

    - name: 4. 反编译 APK
      run: |
        java -jar apktool.jar d nTv.apk -o decompiled_apk

    - name: 5. 深度探索 Smali 结构
      run: |
        echo "=== 0. AndroidManifest 包名 ==="
        grep "package=" decompiled_apk/AndroidManifest.xml
        
        echo -e "\n=== 1. xiao/bu/tv 目录下的文件结构 ==="
        # 即便混淆了，包名路径通常还在，我们看看里面有什么
        ls -la decompiled_apk/smali/xiao/bu/tv/ 2>/dev/null | head -n 50 || echo "没有找到 xiao/bu/tv 目录"
        
        echo -e "\n=== 2. 通过特征字符串定位 HlsProxyServer (即使被混淆) ==="
        # 搜 "HlsProxyServer" 这个 TAG，或者 "Proxy started port=" 日志，或者 "loopback"
        grep -rl "Proxy started port=" decompiled_apk/smali* | head -n 5
        grep -rl "HlsProxyServer" decompiled_apk/smali* | head -n 5
        grep -rl "hls-proxy-accept" decompiled_apk/smali* | head -n 5
        
        echo -e "\n=== 3. 搜索 prefetchGenericSegments 方法名 ==="
        grep -rl "prefetchGenericSegments" decompiled_apk/smali* | head -n 10
        
        echo -e "\n=== 4. 全局搜索 M3U8 关键字，看看哪个文件像代理 ==="
        grep -rl "#EXTM3U" decompiled_apk/smali* | head -n 10
