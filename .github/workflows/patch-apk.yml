name: Explore APK Structure

on:
  workflow_dispatch: # 只能手动触发

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. 下载 Apktool
      run: |
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

    - name: 4. 反编译 APK
      run: |
        java -jar apktool.jar d nTv.apk -o decompiled_apk

    - name: 5. 探索 Smali 结构
      run: |
        echo "=== 1. smali 顶层目录结构 ==="
        find decompiled_apk/smali* -maxdepth 3 -type d | head -n 50
        
        echo "=== 2. 搜索包含 HlsProxyServer 的文件 ==="
        # 因为可能被混淆，我们搜所有文件的内容
        grep -rl "HlsProxyServer" decompiled_apk/smali* | head -n 20 || echo "没有搜到 HlsProxyServer"
        
        echo "=== 3. 搜索包含 prefetchGenericSegments 的文件 ==="
        grep -rl "prefetchGenericSegments" decompiled_apk/smali* | head -n 20 || echo "没有搜到 prefetchGenericSegments"
        
        echo "=== 4. 查看 AndroidManifest 包名 ==="
        grep "package=" decompiled_apk/AndroidManifest.xml

