org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
# Existing Java switch cases require final resource constants.
android.nonFinalResIds=false

# Maven Central 在 CI 上会返回 429（Too Many Requests）。
# 加大重试次数与退避时间，避免一次限流就让整个构建失败。
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=5000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=180000
